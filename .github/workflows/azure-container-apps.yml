# Build the repo Dockerfile (Next.js standalone in monorepo), push to Azure Container Registry,
# then update the Azure Container App to that image.
#
# Required GitHub repository secret:
#   AZURE_CREDENTIALS — JSON for a service principal (az ad sp create-for-rbac --sdk-auth)
#
# That principal must be able to:
#   • Push to ACR — e.g. role "AcrPush" on the registry (or Owner/Contributor on the RG)
#   • Update the Container App — e.g. "Contributor" on the app or resource group
#
# The build job uses `az acr login` after `azure/login`, so you do NOT need ACR_USERNAME /
# ACR_PASSWORD unless you prefer registry admin credentials (optional fallback below).
#
# Registry cadence lives in RG cadence-ui. RESOURCE_GROUP must be the RG that contains
# your Container App (update if the app is not in the same RG as below).
#
# Edit the `env` block below if your Azure resource names differ.

name: Build and deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACR_NAME: cadence
  ACR_LOGIN_SERVER: cadence-c8b2erhwczb0caeu.azurecr.io
  CONTAINER_APP_NAME: cadencely
  RESOURCE_GROUP: cadence-ui
  IMAGE_NAME: cadencely
  DOCKERFILE_PATH: Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (for ACR push via CLI)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR from Azure CLI
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy image to Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ env.ACR_NAME }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          targetPort: "3000"
